# Reverse proxy configuration for constructOS

upstream api_upstream {
    server api:3000;
}

upstream web_upstream {
    server web:80;
}

# Frontend: construct.bloxtcgshop.com
server {
    listen 80;
    server_name construct.bloxtcgshop.com localhost;

    location / {
        proxy_pass http://web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy /api directly if requested on same domain
    location /api/ {
        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Backend API: api-construct.bloxtcgshop.com
server {
    listen 80;
    server_name api-construct.bloxtcgshop.com;

    client_max_body_size 50M;

    location / {
        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
