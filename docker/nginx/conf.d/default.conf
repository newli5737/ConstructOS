# Reverse proxy configuration for constructOS

upstream api_upstream {
    server 127.0.0.1:3000;
}

# Frontend: construct.bloxtcgshop.com
server {
    listen 80;
    server_name construct.bloxtcgshop.com localhost;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Proxy API requests
    location /api/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 50M;
    }

    location / {
        root /var/www/constructos/apps/web/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}

# Backend API: api-construct.bloxtcgshop.com
server {
    listen 80;
    server_name api-construct.bloxtcgshop.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    client_max_body_size 50M;

    location / {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
